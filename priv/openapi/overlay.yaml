  - target: $.paths['/study/{study_id}/participant/{participant_id}/data-points/repeating-data-instance/{repeating_data_instance_id}'].get
    update: {operationId: list_participant_repeating_data_instance_data_points, x-castor-module: DataPoints}
  - target: $.paths['/study/{study_id}/participant/{participant_id}/data-points/survey-instance'].get
