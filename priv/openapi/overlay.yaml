  # Data points
  #
  # Upstream describes a data point with a different schema for each
  # context (StudyFieldResultCollection, SurveyFieldResultCollection, …),
  # names the value `field_value` in collections and `value` in single
  # results, and describes `updated_on` as a Unix epoch while it's a
  # `YYYY-MM-DD HH:MM:SS` string. The client has one DataPoint, with the
  # value always under `value`.

  - target: $.definitions
    update:
      DataPoint:
        type: object
        description: >-
          A stored value of one field, for a participant, in the context of the
          study, a survey (package) instance or a repeating data instance.
        properties:
          field_id: {type: string, format: UUID}
          field_variable_name:
            type: string
            description: Only present on single data points.
          value:
            type: string
            description: >-
              The stored value, always a string; see CastorEDC.FieldValue
              for decoding it by field type.
          field_value:
            type: string
            description: The name collections use for the value.
            x-castor-rename: value
          participant_id: {type: string}
          updated_on:
            type: string
            x-nullable: true
            x-castor-type: naive_datetime
            description: When the value last changed, as YYYY-MM-DD HH:MM:SS.
          repeating_data_instance_id: {type: string, format: UUID}
          repeating_data_instance_name: {type: string}
          survey_instance_id: {type: string, format: UUID}
          survey_name: {type: string}
          survey_package_instance_id: {type: string, format: UUID}
  - target: $.paths.*[?@['x-castor-module'] == 'DataPoints'].responses['200'].schema.properties._embedded.properties.items.items
    update: {$ref: '#/definitions/DataPoint'}
  - target: $.paths.*[?@.operationId == 'get_study_data_point' || @.operationId == 'get_survey_data_point' || @.operationId == 'get_repeating_data_data_point'].responses['200'].schema
    update: {$ref: '#/definitions/DataPoint'}

  # Missing response schemas
  #
  # Responses the spec doesn't describe, as returned by a running API.

  - target: $.paths.*[?@.operationId == 'create_study_data_point' || @.operationId == 'create_survey_data_point' || @.operationId == 'create_repeating_data_data_point'].responses['201']
    description: Creating a single data point returns it, like reading it does.
    update:
      schema: {$ref: '#/definitions/DataPoint'}
  - target: $.paths['/study/{study_id}/survey-package-instance/{survey_package_instance_id}'].patch.responses['200']
    description: Updating a survey package instance returns it, like reading it does.
    update:
      schema: {$ref: '#/definitions/SurveyPackageInstance'}

  # List parameters

  - target: $.paths.*.*.parameters[?@.name == 'field_ids']
    description: >-
      field_ids is a list of field UUIDs that the API takes comma-separated;
      the spec types it as a plain string.
    update:
      type: array
      items: {type: string, format: UUID}
      collectionFormat: csv

  # Batch exports
  #
  # The export list's entries look nothing like the spec says: a finished
  # export is `ready` (not `completed`), the dates are serialised PHP
  # DateTime objects (not strings), `export_name` holds the export type and
  # `export_type` its format, and `created_by` is a user ID. Every download
  # is a zip.

  - target: $.definitions
    update:
      PhpDateTime:
        type: object
        description: >-
          A PHP DateTime object as the API serialises it: a local date and
          time in `date` (YYYY-MM-DD HH:MM:SS.ffffff) and a named time zone in
          `timezone`.
        x-castor-type: datetime
        properties:
          date: {type: string}
          timezone_type: {type: integer}
          timezone: {type: string}
      ExportEntry:
        type: object
        properties:
          id: {type: string, format: UUID}
          status:
            type: string
            enum: [queued, in_progress, ready, failed]
          export_name:
            type: string
            description: The export type, despite the name.
            enum:
              - audit_trail
              - domain_mapping
              - empty_crf
              - form_structure
              - participant_casebook
              - participant_data
              - queries
              - sites
              - survey_compliance
              - uploaded_files
              - validations
            x-castor-rename: type
          export_type:
            type: string
            description: The export format, despite the name.
            enum: [csv, excel, spss, sas_xpt, sas_7bdat, odm, pdf, xml, zip]
            x-castor-rename: format
          created_by:
            type: string
            description: The ID of the user who requested the export.
          created_on: {$ref: '#/definitions/PhpDateTime'}
          completed_on: {$ref: '#/definitions/PhpDateTime'}
          expires_on: {$ref: '#/definitions/PhpDateTime'}
          file_name: {type: string, x-nullable: true}
          file_size: {type: integer, x-nullable: true}
  - target: $.paths['/study/{study_id}/export'].get.responses['200'].schema
    description: Replaced below; the described shape doesn't match the response.
    remove: true
  - target: $.paths['/study/{study_id}/export'].get.responses['200']
    update:
      schema:
        type: object
        properties:
          _embedded:
            type: object
            properties:
              items:
                type: array
                items: {$ref: '#/definitions/ExportEntry'}
          page: {type: integer}
          page_count: {type: integer}
          page_size: {type: integer}
          total_items: {type: integer}
  - target: $.paths['/study/{study_id}/export/{id}/download'].get
    description: "The download is a zip archive, not JSON, and needs `Accept: */*`."
    update:
      produces: [application/zip]
  - target: $.paths['/study/{study_id}/export/{id}/download'].get.responses['200']
    update:
      schema: {type: file}

  # Errors
  #
  # The API answers errors with two different bodies: an RFC 7807 problem
  # from inside an endpoint, and `{"success": false, "errors": [...]}` (or
  # `{"success": false, "reason": ...}`) from the layers in front of it,
  # such as rate limiting and maintenance. The spec only describes the
  # first, and types its `errors` as an object while it's a list.
  # CastorEDC.Error reads all of them; this describes them for reference.

  - target: $.definitions.Error
    update:
      description: >-
        Either an RFC 7807 problem (type, title, status, detail, and for some
        errors `errors` or `validation_messages`), or a body from the layers
        in front of the endpoints (success, errors or reason). Batch export
        errors put the useful message in `description`.
      properties:
        description:
          type: string
          description: The message of batch export errors, which put a generic text in `detail`.
        errors:
          type: array
          description: The individual errors, from either kind of body.
          items:
            type: object
            properties:
              id: {type: string, description: A reference Castor support can trace.}
              code: {type: string}
              error_code: {type: string}
              http_code: {type: integer}
              message: {type: string}
              data: {}
        success:
          type: boolean
          description: Always false, on errors from the layers in front of the endpoints.
        reason:
          type: string
          description: The message of errors that carry neither `detail` nor `errors`.

  # Terminology
  #
  # The client speaks Castor's current terms: participant (not record),
  # visit (not phase), form (not step) and repeating data (not report).
  # Wire names stay as they are; x-castor-rename, x-castor-name and
  # x-castor-enum-names give the client its names. Field types such as
  # add_report_button keep their names, being identifiers rather than
  # terminology, and field_slider_step is a slider's increment.

  - target: $.definitions.Study.properties.expected_records
    update: {x-castor-rename: expected_participants}
  - target: $.definitions.StudyCollectionItem.properties.expected_records
    update: {x-castor-rename: expected_participants}
