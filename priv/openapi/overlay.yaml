  - target: $.paths['/study/{study_id}/export/{id}/download'].get
    update: {operationId: download_export, x-castor-module: Exports}

  # Parameter names
  #
  # Parameters whose wire name isn't snake_case, or doesn't read well as an
  # Elixir option, get an x-castor-name. The client sends the wire name.
  - target: $.paths.*.*.parameters[?@.name == 'fieldDependency_id']
    update: {x-castor-name: field_dependency_id}
  - target: $.paths.*.*.parameters[?@.name == 'fieldValidation_id']
    update: {x-castor-name: field_validation_id}
  - target: $.paths.*.*.parameters[?@.name == 'optiongroup_id']
    update: {x-castor-name: option_group_id}
  - target: $.paths.*.*.parameters[?@.name == 'metadatatype_id']
    update: {x-castor-name: metadata_type_id}
  - target: $.paths.*.*.parameters[?@.name == 'participantId[]']
    update: {x-castor-name: participant_ids}
  - target: $.paths.*.*.parameters[?@.name == 'siteId[]']
    update: {x-castor-name: site_ids}
  - target: $.paths.*.*.parameters[?@.name == 'participantStatus[]']
    update: {x-castor-name: participant_statuses}
  - target: $.paths.*.*.parameters[?@.name == 'surveyPackageId[]']
    update: {x-castor-name: survey_package_ids}
  - target: $.paths.*.*.parameters[?@.name == 'surveyPackageStatus[]']
    update: {x-castor-name: survey_package_statuses}
  - target: $.paths.*.*.parameters[?@.name == 'availabilityStart']
    update: {x-castor-name: availability_start}
  - target: $.paths.*.*.parameters[?@.name == 'availabilityEnd']
    update: {x-castor-name: availability_end}
  - target: $.paths.*.*.parameters[?@.name == 'complianceOption']
    update: {x-castor-name: compliance_option}
  - target: $.paths.*.*.parameters[?@.name == 'parentId']
    update: {x-castor-name: parent_id}
  - target: $.paths.*.*.parameters[?@.name == 'parentType']
    update: {x-castor-name: parent_type}
  - target: $.paths.*.*.parameters[?@.name == 'field[]'].items
    description: The filter below takes a map, not a list of IDs.
    remove: true
  - target: $.paths.*.*.parameters[?@.name == 'field[]']
    description: >-
      Filters participants on field values, used as `field[ID]=VALUE` per
      field, so a map of field IDs to values rather than the list of IDs
      upstream describes; the wire name is `field`, with the ID in brackets.
    update:
      name: field
      type: object
      style: deepObject
      explode: true
      x-castor-name: fields
  - target: $.paths.*.*.parameters[?@.name == 'finished_on[gt]']
    update: {x-castor-name: finished_after}
  - target: $.paths.*.*.parameters[?@.name == 'finished_on[gte]']
    update: {x-castor-name: finished_on_or_after}
  - target: $.paths.*.*.parameters[?@.name == 'finished_on[lt]']
    update: {x-castor-name: finished_before}
  - target: $.paths.*.*.parameters[?@.name == 'finished_on[lte]']
    update: {x-castor-name: finished_on_or_before}
  - target: $.paths['/study/{study_id}/export/{id}/download'].get.parameters[?@.name == 'id']
    update: {x-castor-name: export_id}

  # Option types
  #
  # The same kind of option takes the same kind of value everywhere: a
  # boolean for a yes or no, sent as 1 or 0 where the API takes an integer
  # (x-castor-wire), and a list for what to include.

  - target: $.paths.*.*.parameters[?@.name == 'archived' && @.type == 'integer']
    description: Accepts 0 or 1, so a boolean, as list_survey_package_instances' archived is.
    update: {type: boolean, x-castor-wire: integer}
  - target: $.paths.*.*.parameters[?@.name == 'validations' && @.type == 'integer']
    description: Set to 1 to include each field's validations, so a boolean.
    update: {type: boolean, x-castor-wire: integer}
  - target: $.paths.*.*.parameters[?@.name == 'validations' && @.default == 0]
    description: The default of false, spelt as the boolean.
    update: {default: false}
  - target: $.paths.*[?@.operationId == 'list_participants'].parameters[?@.name == 'archived']
    description: Described as the boolean it now is.
    update:
      description: >-
        `true` for only archived participants, `false` for only unarchived
        ones; all participants when left out.
  - target: $.paths.*[?@.operationId == 'list_repeating_data_instances' || @.operationId == 'list_participant_repeating_data_instances' || @.operationId == 'list_repeating_data_progress'].parameters[?@.name == 'archived']
    description: Described as the boolean it now is.
    update:
      description: >-
        `true` for only archived repeating data instances, `false` (what the
        API does when it's left out) for only unarchived ones.
  - target: $.paths.*.*.parameters[?@.name == 'validations']
    description: Described as the boolean it now is.
