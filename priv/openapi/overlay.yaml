  # Collections and pagination
  #
  # x-castor-items is where the records of a collection sit in the response:
  # usually under `_embedded`, with a key that differs per operation and
  # often from what the spec says (`metadatas`, not `steps`;
  # `repeatingDataInstance`, not `repeatingDataInstances`), and in two cases
  # in a body of its own (`results` for countries, `data` for survey
  # compliance). x-castor-max-page-size is the largest page_size the API
  # accepts; the client clamps to it, because a larger one is rejected with
  # a 416 (or a 422 for survey package instances). Both were checked against
  # a running API.
  - target: $.paths['/study/{study_id}/site'].get
    update: {x-castor-items: _embedded.sites, x-castor-max-page-size: 1000}
  - target: $.paths['/study/{study_id}/site'].get.parameters
    description: The operation pages, but the spec doesn't declare its page_size parameter.
    update: {name: page_size, in: query, type: integer, description: The number of records per page., maximum: 1000}
  - target: $.paths['/study/{study_id}/participant'].get
    update: {x-castor-items: _embedded.participants, x-castor-max-page-size: 1000}
  - target: $.paths['/study/{study_id}/participant'].get.parameters
    description: The operation pages, but the spec doesn't declare its page_size parameter.
    update: {name: page_size, in: query, type: integer, description: The number of records per page., maximum: 1000}
  - target: $.paths['/study/{study_id}/participant-progress/forms'].get
    update: {x-castor-items: _embedded.participants}
  - target: $.paths['/study/{study_id}/participant-progress/forms'].get.parameters
    description: The operation pages, but the spec doesn't declare its page_size parameter.
    update: {name: page_size, in: query, type: integer, description: The number of records per page.}
  - target: $.paths['/study/{study_id}/participant-progress/{participant_id}/visit'].get
    update: {x-castor-items: _embedded.items, x-castor-max-page-size: 100}
  - target: $.paths['/study/{study_id}/participant-progress/{participant_id}/repeating-data'].get
