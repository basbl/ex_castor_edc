# Corrections to the Castor EDC API spec, as an OpenAPI Overlay 1.0 document.
#
# `mix castor_edc.spec.build` applies these actions, in order, to
# priv/openapi/upstream.json and writes the result to
# priv/openapi/castor_edc.json, which the client is generated from.
#
# Every action says why it exists in its description. A target that selects
# nothing fails the build: the upstream spec has changed under the
# correction, and it needs another look. Every correction is also reported
# upstream, so this file shrinks as the published spec improves.
overlay: 1.0.0
info:
  title: Castor EDC API corrections
  version: 1.0.0
actions:
  - target: $.paths['/']
    description: >-
      Upstream hides an undocumented endpoint (the participant PIN) by giving
      it a `paths: {"/": []}` fragment, which leaves an empty list where a
      path item object belongs, so the document doesn't validate.
    remove: true

  # Operations outside the client

  - target: $.paths.*[?@.deprecated == true]
    description: >-
      Deprecated operations (58, mostly the record, report, phase and step
      routes and the data point collections) get Sunset headers upstream and
      aren't part of the client.
    remove: true
  - target: $.paths['/study/{study_id}/export'].post.tags[?@ == 'beta']
    description: >-
      Batch exports are tagged beta, but they're the supported way to export
      (the synchronous CSV exports are deprecated), so the client keeps them.
    remove: true
  - target: $.paths.*[?@.tags[?@ == 'beta']]
    description: >-
      The other beta operations (audit trail, domains, monitoring
      validations) may still change upstream and aren't part of the client.
    remove: true
  - target: $.paths.*[?@.tags[?@ == 'castor-internal']]
    description: The custom export upload is for Castor's internal use.
    remove: true
  - target: $.paths['/study/{study_id}/participant/{participant_id}/device-token']
    description: >-
      Device tokens belong to the participant app and need the `record`
      scope, which is for Castor's own apps.
    remove: true
  - target: $.paths['/study/{study_id}/participant/{participant_id}/survey-package-instance'].patch
    description: >-
      Marks survey package instances received or started from the
      participant app; it needs the `record` scope.
    remove: true
  - target: $.paths['/study/{study_id}/participant/{participant_id}/survey-package-instance/{survey_package_instance_id}'].patch
    description: >-
      Records when a participant started or received a survey package
      instance, from the participant app. The spec allows the default scope,
      but with it the API answers 500.
    remove: true
  - target: $.paths['/study/{study_id}/participant/{participant_id}/econsent']
    description: The eConsent integration is internal to Castor.
    remove: true
  - target: $.paths['/study/{study_id}/export/data'].get
    description: >-
      The synchronous data export is deprecated, though the spec doesn't flag
      it; batch exports replace it.
    remove: true
  - target: $.paths['/study/{study_id}/export/structure'].get
    description: >-
      The synchronous structure export is deprecated, though the spec doesn't
      flag it; the form_structure batch export replaces it.
    remove: true
  - target: $.paths['/study/{study_id}/export/optiongroups'].get
    description: >-
      The synchronous option group export is deprecated, though the spec
      doesn't flag it; listing option groups replaces it.
    remove: true
  - target: $.paths['/study/{study_id}/participant/{participant_id}/data-point/study'].get
    description: >-
      Lists a participant's study data like GET .../data-points/study, but
      through an older serialiser that names the value `value` instead of
      `field_value`. The client keeps one operation per capability.
    remove: true
  - target: $.paths['/study/{study_id}/participant/{participant_id}/data-point/survey/{survey_instance_id}'].get
    description: >-
      Duplicates GET .../data-points/survey-instance/{survey_instance_id}
      through the older serialiser.
    remove: true
  - target: $.paths['/study/{study_id}/participant/{participant_id}/data-point/repeating-data/{repeating_data_instance_id}'].get
    description: >-
      Duplicates GET .../data-points/repeating-data-instance/{repeating_data_instance_id}
      through the older serialiser.
    remove: true

