  - target: $.paths['/study/{study_id}/participant/{participant_id}/repeating-data-instance'].post
    update: {operationId: create_repeating_data_instance, x-castor-module: RepeatingData}
  - target: $.paths['/study/{study_id}/participant/{participant_id}/repeating-data-instance-collection'].post
