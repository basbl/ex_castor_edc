  # Data points
  #
  # Upstream describes a data point with a different schema for each
  # context (StudyFieldResultCollection, SurveyFieldResultCollection, …),
  # names the value `field_value` in collections and `value` in single
  # results, and describes `updated_on` as a Unix epoch while it's a
  # `YYYY-MM-DD HH:MM:SS` string. The client has one DataPoint, with the
  # value always under `value`.

  - target: $.definitions
    update:
      DataPoint:
        type: object
        description: >-
          A stored value of one field, for a participant, in the context of the
          study, a survey (package) instance or a repeating data instance.
        properties:
          field_id: {type: string, format: UUID}
          field_variable_name:
            type: string
            description: Only present on single data points.
          value:
            type: string
            description: >-
              The stored value, always a string; see CastorEDC.FieldValue
              for decoding it by field type. A value that was cleared stays
              in the lists, as an empty string with its own updated_on.
          field_value:
            type: string
            description: >-
              The stored value, always a string; see CastorEDC.FieldValue
              for decoding it by field type. A value that was cleared stays
              in the lists, as an empty string with its own updated_on.
            x-castor-rename: value
          participant_id: {type: string}
          updated_on:
            type: string
            x-nullable: true
            x-castor-type: naive_datetime
            description: >-
              When the value last changed, in the server's local time, not
              UTC; see CastorEDC.time_zone/1.
          repeating_data_instance_id: {type: string, format: UUID}
          repeating_data_instance_name: {type: string}
          survey_instance_id: {type: string, format: UUID}
          survey_name: {type: string}
          survey_package_instance_id: {type: string, format: UUID}
  - target: $.paths.*[?@['x-castor-module'] == 'DataPoints'].responses['200'].schema.properties._embedded.properties.items.items
    update: {$ref: '#/definitions/DataPoint'}
  - target: $.paths.*[?@.operationId == 'get_study_data_point' || @.operationId == 'get_survey_data_point' || @.operationId == 'get_repeating_data_data_point'].responses['200'].schema
    update: {$ref: '#/definitions/DataPoint'}

  # Missing response schemas
  #
  # Responses the spec doesn't describe, as returned by a running API.

  - target: $.paths.*[?@.operationId == 'create_study_data_point' || @.operationId == 'create_survey_data_point' || @.operationId == 'create_repeating_data_data_point'].responses['201']
    description: Creating a single data point returns it, like reading it does.
    update:
      schema: {$ref: '#/definitions/DataPoint'}
  - target: $.paths['/study/{study_id}/survey-package-instance/{survey_package_instance_id}'].patch.responses['200']
    description: Updating a survey package instance returns it, like reading it does.
    update:
      schema: {$ref: '#/definitions/SurveyPackageInstance'}

  # List parameters

  - target: $.paths.*.*.parameters[?@.name == 'field_ids']
    description: >-
      field_ids is a list of field UUIDs that the API takes comma-separated;
      the spec types it as a plain string.
    update:
      type: array
      items: {type: string, format: UUID}
      collectionFormat: csv

  # Batch exports
  #
  # The export list's entries look nothing like the spec says: a finished
  # export is `ready` (not `completed`), the dates are serialised PHP
  # DateTime objects (not strings) like elsewhere in the API, `export_name` holds the export type and
  # `export_type` its format, and `created_by` is a user ID. Every download
  # is a zip.

  - target: $.definitions
    update:
      ExportEntry:
        type: object
        properties:
          id: {type: string, format: UUID}
          status:
            type: string
            enum: [queued, in_progress, ready, failed]
          export_name:
            type: string
            description: The export type, despite the name.
            enum:
              - audit_trail
              - domain_mapping
              - empty_crf
              - form_structure
              - participant_casebook
              - participant_data
              - queries
              - sites
              - survey_compliance
              - uploaded_files
              - validations
            x-castor-rename: type
          export_type:
            type: string
            description: The export format, despite the name.
            enum: [csv, excel, spss, sas_xpt, sas_7bdat, odm, pdf, xml, zip]
            x-castor-rename: format
          created_by:
            type: string
            description: The ID of the user who requested the export.
          created_on: {$ref: '#/definitions/DateTime'}
          completed_on: {$ref: '#/definitions/DateTime'}
          expires_on: {$ref: '#/definitions/DateTime'}
          file_name: {type: string, x-nullable: true}
          file_size: {type: integer, x-nullable: true}
  - target: $.definitions.DateTime
    description: >-
      A serialised PHP DateTime object: a local date and time in `date`
      (YYYY-MM-DD HH:MM:SS.ffffff) and a named time zone in `timezone`. The
      client turns it into a DateTime in that zone, and describes it so.
    update:
      x-castor-type: datetime
      description: >-
        A DateTime in the server's time zone (see CastorEDC.time_zone/1);
        compare it with DateTime.compare/2.
  - target: $.paths['/study/{study_id}/export'].get.responses['200'].schema
    description: Replaced below; the described shape doesn't match the response.
    remove: true
  - target: $.paths['/study/{study_id}/export'].get.responses['200']
    update:
      schema:
        type: object
        properties:
          _embedded:
            type: object
            properties:
              items:
                type: array
                items: {$ref: '#/definitions/ExportEntry'}
          page: {type: integer}
          page_count: {type: integer}
          page_size: {type: integer}
          total_items: {type: integer}
  - target: $.paths['/study/{study_id}/export/{id}/download'].get
    description: "The download is a zip archive, not JSON, and needs `Accept: */*`."
    update:
      produces: [application/zip]
  - target: $.paths['/study/{study_id}/export/{id}/download'].get.responses['200']
    update:
      schema: {type: file}

  # Errors
  #
  # The API answers errors with two different bodies: an RFC 7807 problem
  # from inside an endpoint, and `{"success": false, "errors": [...]}` (or
  # `{"success": false, "reason": ...}`) from the layers in front of it,
  # such as rate limiting and maintenance. The spec only describes the
  # first, and types its `errors` as an object while it's a list.
  # CastorEDC.Error reads all of them; this describes them for reference.

  - target: $.definitions.Error
    update:
      description: >-
        Either an RFC 7807 problem (type, title, status, detail, and for some
        errors `errors` or `validation_messages`), or a body from the layers
        in front of the endpoints (success, errors or reason). Batch export
        errors put the useful message in `description`.
      properties:
        description:
          type: string
          description: The message of batch export errors, which put a generic text in `detail`.
        errors:
          type: array
          description: The individual errors, from either kind of body.
          items:
            type: object
            properties:
              id: {type: string, description: A reference Castor support can trace.}
              code: {type: string}
              error_code: {type: string}
              http_code: {type: integer}
              message: {type: string}
              data: {}
        success:
          type: boolean
          description: Always false, on errors from the layers in front of the endpoints.
        reason:
          type: string
          description: The message of errors that carry neither `detail` nor `errors`.

  # One struct per resource
  #
  # Upstream describes some lists with a copy of the resource's schema minus a
  # field or two (no `_links`, no last data point date), which would make a
  # second struct for the same thing: a `%Country{}` match would miss every
  # country from the list. The lists use the resource's schema instead, and
  # the copies go.

  - target: $.paths['/country'].get.responses['200'].schema.properties.results.items
    description: CountryWithNoHalLinks is Country without `_links`.
    update: {$ref: '#/definitions/Country'}
  - target: $.paths['/study'].get.responses['200'].schema.properties._embedded.properties.study.items
    description: StudyCollectionItem is Study without `last_datapoint_collected_on`.
    update: {$ref: '#/definitions/Study'}
  - target: $.definitions.SiteCollection.properties.success.items
    description: SiteNoLinks is Site without `_links` and the date formats.
    update: {$ref: '#/definitions/Site'}
  - target: $.definitions.CountryWithNoHalLinks
    description: Replaced by Country above.
    remove: true
  - target: $.definitions.StudyCollectionItem
    description: Replaced by Study above.
    remove: true
  - target: $.definitions.SiteNoLinks
    description: Replaced by Site above.
    remove: true

  # Dates sent as text
  #
  # These are typed as plain strings, but they're dates and times as
  # YYYY-MM-DD HH:MM:SS, in the server's time zone like a data point's
  # updated_on, so the client reads them as NaiveDateTimes as it does that.

  - target: $.definitions.Study.properties.created_on
    description: A date and time as YYYY-MM-DD HH:MM:SS, typed as a plain string.
    update: {x-castor-type: naive_datetime}
  - target: $.definitions.Study.properties.first_live_on
    description: A date and time as YYYY-MM-DD HH:MM:SS, typed as a plain string.
    update: {x-castor-type: naive_datetime}
  - target: $.definitions.Study.properties.last_datapoint_collected_on
    description: A date and time as YYYY-MM-DD HH:MM:SS, typed as a plain string.
    update: {x-castor-type: naive_datetime}
  - target: $.definitions.RepeatingDataInstance.properties.created_on
    description: A date and time as YYYY-MM-DD HH:MM:SS, typed as a plain string.
    update: {x-castor-type: naive_datetime}

  # Terminology
  #
  # The client speaks Castor's current terms: participant (not record),
  # visit (not phase), form (not step) and repeating data (not report).
  # Wire names stay as they are; x-castor-rename, x-castor-name and
  # x-castor-enum-names give the client its names. Field types such as
  # add_report_button keep their names, being identifiers rather than
  # terminology, and field_slider_step is a slider's increment.

  - target: $.definitions.Study.properties.expected_records
    update: {x-castor-rename: expected_participants}
  - target: $.definitions.StudyStatistics.properties.records
    update: {x-castor-rename: participants}
  - target: $.definitions.InstituteRecordsStatistics.properties.record_count
    update: {x-castor-rename: participant_count}
  - target: $.definitions.ManagementPermissions.properties.manage_records
    update: {x-castor-rename: manage_participants}
  - target: $.definitions.Participant.properties.last_opened_step
    update: {x-castor-rename: last_opened_form}
  - target: $.definitions.ParticipantProgress.properties.forms.items.properties.step_id
    update: {x-castor-rename: form_id}
  - target: $.definitions.Query.properties.record_id
    update: {x-castor-rename: participant_id}
  - target: $.definitions.Verification.properties.record_id
    update: {x-castor-rename: participant_id}
  - target: $.definitions.SurveyPackage.properties.allow_step_navigation
    update: {x-castor-rename: allow_form_navigation}
  - target: $.definitions.SurveyPackage.properties.show_step_navigator
    update: {x-castor-rename: show_form_navigator}
  - target: $.definitions.Field.properties
    description: >-
      Fields of repeating data carry the repeating data's ID under report_id,
      which the spec doesn't declare.
    update:
      report_id:
        type: string
        format: UUID
        x-nullable: true
        x-castor-rename: repeating_data_id
  - target: $.paths['/study/{study_id}/verification'].get.parameters[?@.name == 'record_id']
    update: {x-castor-name: participant_id}
  - target: $.definitions.BatchExportRequest.properties.exports.properties.form_structure.items.properties.filters.properties.element_type
    update:
      x-castor-enum-names:
        phase: visit
        step: form
        reports: repeating_data
        report: repeating_data_item
        report_step: repeating_data_form
        report_field: repeating_data_field
        survey_step: survey_form
  # The API reads these whether or not they're sent, and a missing one fails
  # the request with a 500: a form structure export needs both options (true
  # is what the export itself defaults to), and an empty CRF a paper size.
  - target: $.definitions.BatchExportRequest.properties.exports.properties.form_structure.items.properties.options
    update:
      required: [include_annotations, include_domains]
      properties:
        include_annotations: {default: true}
        include_domains: {default: true}
  - target: $.definitions.BatchExportRequest.properties.exports.properties.empty_crf.items.properties.filters
    update:
      required: [paper_size]
      properties:
        paper_size: {default: a4paper}
  # Most participant data options only apply to some formats, and either to
  # the default export or to the grouped (domain based) one that `grouped:
  # true` asks for. The API refuses an option outside those with "Fields not
  # allowed for this request", which the spec doesn't mention.
  - target: $.definitions.BatchExportRequest.properties.exports.properties.participant_data.items.properties.options
    update:
      x-castor-requires:
        grouped: {formats: [csv, sas_xpt, sas_7bdat]}
        include_encrypted_fields: {formats: [csv, excel, spss, sas_xpt, sas_7bdat], grouped: false}
        include_comments: {formats: [csv, excel], grouped: false}
        include_queries: {formats: [csv, excel], grouped: false}
        include_verifications: {formats: [csv, excel], grouped: false}
        display_options_as: {formats: [csv, excel], grouped: false}
        export_missing_data_in: {formats: [csv, sas_xpt, sas_7bdat], grouped: true}
        include_empty_rows: {formats: [csv, sas_xpt, sas_7bdat], grouped: true}
        include_survey_metadata: {formats: [csv, sas_xpt, sas_7bdat], grouped: true}
        export_coded_options_as: {formats: [csv, sas_xpt, sas_7bdat], grouped: true}
        export_dates_as: {formats: [sas_xpt, sas_7bdat], grouped: true}

  # Data point writes
  #
  # The bulk data point writes answer 201 even when some or all values fail,
  # listing what was saved under `success` and what wasn't under `failed`.
  # A value for a field outside the endpoint's context (a survey field sent
  # to the study endpoint) fails as "Unsupported field type". The client
  # returns a CastorEDC.DataPointsResult instead of hiding the failures in a
  # success, and its `!` functions raise when anything failed.

  - target: $.definitions
    update:
      DataPointFailure:
        type: object
        properties:
          id: {type: string, description: A reference Castor support can trace.}
          code: {type: string}
          message: {type: string}
          field_id: {type: string, format: UUID}
          participant_id: {type: string}
          data: {}
      DataPointsResult:
        type: object
        properties:
          success:
            type: array
            items: {$ref: '#/definitions/DataPoint'}
            x-castor-rename: saved
          failed:
            type: array
            items: {$ref: '#/definitions/DataPointFailure'}
          total_processed: {type: integer}
          total_success: {type: integer}
          total_failed: {type: integer}
          survey_package_instance_id:
            type: string
            format: UUID
            description: Only when the write created a survey package instance.
  - target: $.paths.*[?@.operationId == 'upsert_study_data_points' || @.operationId == 'upsert_repeating_data_instance_data_points' || @.operationId == 'upsert_survey_instance_data_points' || @.operationId == 'upsert_survey_package_instance_data_points' || @.operationId == 'create_survey_package_instance_with_data_points']
    update: {x-castor-partial-success: true}
  - target: $.paths.*[?@['x-castor-partial-success'] == true && @.operationId != 'create_site' && @.operationId != 'create_repeating_data_instances'].responses['201'].schema
    update: {$ref: '#/definitions/DataPointsResult'}
  - target: $.paths.*[?@.operationId == 'create_site' || @.operationId == 'create_repeating_data_instances']
    description: >-
      Creating sites and repeating data instances answers like a bulk data
      point write: 201 with what was created under `success` and what
      wasn't under `failed`. The client treats them alike, so their `!`
      functions raise when anything failed.
    update: {x-castor-partial-success: true}
  - target: $.definitions.SiteCollection.properties.success
    description: Named as in DataPointsResult.
    update: {x-castor-rename: saved}
  - target: $.definitions.RepeatingDataInstanceCollection.properties.success
    description: Named as in DataPointsResult.
    update: {x-castor-rename: saved}

  # Collection schemas
  #
  # Some collections put their records under a different key than their
  # schema says, or aren't described as HAL at all. These schemas describe
  # where the records really are, so the client knows what they decode into.

  - target: $.paths['/study/{study_id}/metadata'].get.responses['200'].schema.properties._embedded.properties
    description: The records sit under `metadatas`, not `steps`.
    update:
      metadatas: {type: array, items: {$ref: '#/definitions/Metadata'}}
  - target: $.paths['/study/{study_id}/metadatatype'].get.responses['200'].schema.properties._embedded.properties
    description: The records sit under `metadatatypes`, not `steps`.
    update:
      metadatatypes: {type: array, items: {$ref: '#/definitions/MetadataType'}}
  - target: $.paths['/study/{study_id}/repeating-data-instance'].get.responses['200'].schema.properties._embedded.properties
    description: The records sit under `repeatingDataInstance`, not `repeatingDataInstances`.
    update:
      repeatingDataInstance: {type: array, items: {$ref: '#/definitions/RepeatingDataInstance'}}
  - target: $.paths['/study/{study_id}/participant/{participant_id}/repeating-data-instance'].get.responses['200'].schema.properties._embedded.properties
    description: The records sit under `repeatingDataInstance`, not `repeatingDataInstances`.
    update:
      repeatingDataInstance: {type: array, items: {$ref: '#/definitions/RepeatingDataInstance'}}
  - target: $.paths['/user'].get.responses['200'].schema
    description: Users come as a HAL collection under `user`, not as a bare array.
    remove: true
  - target: $.paths['/user'].get.responses['200']
    update:
      schema:
        type: object
        properties:
          _embedded:
            type: object
            properties:
              user: {type: array, items: {$ref: '#/definitions/User'}}
          total_items: {type: integer}
  - target: $.paths['/study/{study_id}/user'].get.responses['200'].schema
    description: Study users come as a HAL collection under `studyUsers`, not as a bare array.
    remove: true
  - target: $.paths['/study/{study_id}/user'].get.responses['200']
    update:
      schema:
        type: object
        properties:
          _embedded:
            type: object
            properties:
              studyUsers: {type: array, items: {$ref: '#/definitions/StudyUser'}}
          total_items: {type: integer}

  # Missing schemas

  - target: $.definitions.Site
    description: The spec describes a site with nothing but its links; this is what the API returns.
    update:
      properties:
        id: {type: string, format: UUID}
        site_id: {type: string, format: UUID, description: The same as `id`.}
        name: {type: string}
        abbreviation: {type: string}
        code: {type: string}
        order: {type: integer}
        deleted: {type: boolean}
        country_id: {type: integer}
        date_format: {type: string, description: "The site's date format, such as `Y-m-d`."}
        date_display_format: {type: string, description: "The same format for display, such as `YYYY-MM-DD`."}

  # Module descriptions

  - target: $
    description: The description of each module the client is generated into.
    update:
      x-castor-modules:
        Countries: The countries Castor EDC knows, for site and participant addresses.
        DataPoints: >-
          The values collected for participants: reading them per study, per
          participant or per survey, repeating data or survey package instance,
          and writing them one at a time or in bulk. Values are strings; see
          CastorEDC.FieldValue for decoding them by field type.
        Exports: >-
          Batch exports: queuing them, listing them with their status, and
          downloading the result. CastorEDC.Export does all three in one call.
        Fields: The fields of a study, with their dependencies and validations.
        Forms: The forms of a study and the visits that group them.
        Metadata: Metadata attached to a study's elements, and the types of metadata.
        OptionGroups: The option groups behind radio, dropdown and checkbox fields.
        Participants: The participants of a study, and their progress through its forms.
        Queries: Queries raised on a study's data.
        Randomization: Randomizing participants and reading their randomization.
        RepeatingData: >-
          Repeating data: its definitions and forms, and the instances created
          for participants.
        Roles: The roles of a study.
        Sites: The sites of a study.
        Studies: The studies the credentials have access to, with their metadata and statistics.
        StudyUsers: The users of a study, and their roles per site.
        Surveys: >-
          Surveys, their forms and packages, the instances sent to
          participants, and survey compliance.
        Users: The users the credentials can see.
        Verifications: Verifications (such as source data verification) of a study's data.

  # Fields the spec leaves out
  #
  # What a running API sends that the spec doesn't describe, found by
  # decoding the recorded fixtures.

  - target: $.definitions.Field.properties
    update:
      additional_config: {type: string, description: Extra configuration of the field, as the field type defines it.}
      exclude_on_data_export: {type: boolean, description: Whether exports leave the field out.}
      field_min: {type: number, x-nullable: true, description: The lowest value allowed.}
      field_min_label: {type: string, description: The label of the lowest value, for sliders.}
      field_max: {type: number, x-nullable: true, description: The highest value allowed.}
      field_max_label: {type: string, description: The label of the highest value, for sliders.}
      field_summary_template: {type: string, description: The template of a summary field.}
  - target: $.definitions.FieldOption.properties
    update:
      domainVariableNameOverride:
        type: string
        x-nullable: true
        description: The variable name to use for this option in domain mappings, when it differs.
        x-castor-rename: domain_variable_name_override
  - target: $.definitions.FieldValidation.properties
    update:
      operator: {type: string, description: "The comparison the validation makes, such as `>`."}
  - target: $.definitions.Participant.properties
    update:
      archived: {type: boolean}
      randomized_id: {type: string, x-nullable: true, description: The participant's randomization ID.}
  - target: $.definitions.RepeatingDataInstance.properties
    update:
      repeating_data_name: {type: string, description: The name of the repeating data this is an instance of.}
  - target: $.definitions.Study.properties
    update:
      crf_id: {type: string, format: UUID, description: The ID of the study's case report form.}
  - target: $.definitions.SurveyForm.properties
    update:
      footer_text: {type: string}
  - target: $.definitions.SurveyPackage.properties._embbeded
    description: >-
      A misspelt `_embedded`; the surveys of a package come under `surveys`,
      which is null when the package isn't listed with them.
    remove: true
  - target: $.definitions.SurveyPackage.properties
    update:
      surveys:
        type: array
        x-nullable: true
        description: The surveys in this package.
        items: {$ref: '#/definitions/Survey'}

  # The progress collections put their forms at the top level, not under
  # _embedded as the spec says, and name the participant.

  - target: $.definitions.ParticipantProgressVisitCollection.properties._embedded
    remove: true
  - target: $.definitions.ParticipantProgressRepeatingDataCollection.properties._embedded
    remove: true
  - target: $.definitions.ParticipantProgressVisitCollection.properties
    update:
      participant_id: {type: string}
      forms:
        type: array
        description: The progress of each form.
        items:
          type: object
          properties:
            form_id: {type: string, format: UUID}
            complete: {type: integer, description: "0 when not started, 1 when in progress, 2 when done."}
            progress: {type: integer, description: Percentage of completion.}
            locked: {type: boolean}
            sdv: {type: boolean, description: Whether the form is source data verified.}
            signed: {type: boolean}
  - target: $.definitions.ParticipantProgressRepeatingDataCollection.properties
    update:
      participant_id: {type: string}
      forms:
        type: array
        description: The progress of each form.
        items:
          type: object
          properties:
            form_id: {type: string, format: UUID}
            complete: {type: integer, description: "0 when not started, 1 when in progress, 2 when done."}
            progress: {type: integer, description: Percentage of completion.}
            locked: {type: boolean}
            sdv: {type: boolean, description: Whether the form is source data verified.}
            signed: {type: boolean}

  - target: $.definitions.Field.properties.option_group
    description: >-
      With include=optiongroup the API sends a field's option group as one
      object (and null for fields without options), not a list.
    remove: true
  - target: $.definitions.Field.properties
    update:
      option_group:
        $ref: '#/definitions/FieldOptionGroup'
        description: The field's option group, when listed with include=optiongroup and the field has options.

  - target: $.definitions.DataPoint.properties
    description: >-
      Data points of a survey package instance name the package, and single
      data points embed their field, participant and repeating data instance.
    update:
      survey_package_id: {type: string, format: UUID}
      _embedded:
        type: object
        properties:
          field: {$ref: '#/definitions/Field'}
          participant: {$ref: '#/definitions/Participant'}
          repeating_data_instance: {$ref: '#/definitions/RepeatingDataInstance'}

  - target: $.paths.*[?@.operationId == 'upsert_repeating_data_instance_data_points']
    description: >-
      Each value needs its repeating data instance's ID although the path has
      it already (confirmed); the client fills it in.
    update:
      x-castor-fill-items:
        data: {instance_id: repeating_data_instance_id}
